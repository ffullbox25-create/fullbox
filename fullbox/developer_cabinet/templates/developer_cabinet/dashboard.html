<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FULLBOX | Кабинет разработчика</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffdf8;
      --text: #23231f;
      --muted: #7b756a;
      --line: #ddd5c8;
      --accent: #0f7f67;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 10%, rgba(15, 127, 103, .12), transparent 30%),
                  linear-gradient(135deg, #f8f5ee 0%, #eee9df 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .page { width: 100%; margin: 0 auto; padding: 0; }
    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 0;
      align-items: start;
      min-height: 100vh;
    }
    .panel {
      background: rgba(255, 253, 248, .88);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 22px 50px rgba(54, 46, 31, .12);
      backdrop-filter: blur(10px);
    }
    .side {
      padding: 20px;
      position: sticky;
      top: 0;
      min-height: 100vh;
      border-radius: 0;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 32px;
    }
    .nav { display: grid; gap: 10px; }
    .nav a {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .48);
      font-weight: 650;
    }
    .nav a:hover {
      border-color: rgba(15, 127, 103, .45);
      color: var(--accent);
    }
    .main {
      min-height: 100vh;
      padding: 28px;
      border-radius: 0;
    }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: static; min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <aside class="panel side">
        <div class="brand">FULLBOX</div>
        <nav class="nav">
          <a href="/dev/">Кабинет разработчика</a>
          <a href="/head-manager/stock-editor/">Редактор остатков</a>
          <a href="/sklad/sku-stock/">Остатки SKU</a>
          <a href="/dev/chz-import/">Импорт товара с ЧЗ</a>
          <a href="/revisor/">Инспекционный сервис</a>
          <a href="/head-manager/report/">Отчет по движению</a>
          <a href="/employees/">Список пользователей</a>
          <a href="/logout/">Выход</a>
        </nav>
      </aside>
      <main class="panel main"></main>
    </div>
  </div>
</body>
</html>
