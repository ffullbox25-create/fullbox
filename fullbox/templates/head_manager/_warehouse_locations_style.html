<style>
  /* Page-local styles: the common head-manager sidebar and warehouse rules stay intact. */
  main { min-width: 0; }
  .metrics { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .location-layout { display:flex; flex-direction:column; gap:14px; min-width:0; }
  .location-directory { order:-1; min-width:0; }
  .location-layout [hidden] { display:none !important; }
  .location-layout input, .location-layout select { min-width:0; max-width:100%; }
  .location-layout .btn { min-height:38px; white-space:normal; text-align:center; }
  .location-layout button:disabled { opacity:.55; cursor:not-allowed; }
  .location-layout :focus-visible { outline:3px solid #f89000; outline-offset:2px; }
  .location-filters { display:grid; grid-template-columns:minmax(180px,1.5fr) repeat(3,minmax(120px,1fr)); gap:10px; padding:14px 16px; border-bottom:1px solid var(--stroke); }
  .location-selection { display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; padding:10px 16px; }
  .location-selection > span { color:var(--muted); margin-right:auto; font-size:13px; }
  .location-check { display:flex; align-items:center; gap:8px; color:var(--ink); cursor:pointer; }
  .location-check input { flex:0 0 20px; width:20px; height:20px; min-height:20px; margin:0; accent-color:#f89000; }
  .location-check small { display:block; color:var(--muted); }
  .location-select { min-height:40px; justify-content:center; }
  .location-select .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .location-zone-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 16px; background:#f7f7f7; border-block:1px solid var(--stroke); font-size:13px; }
  .location-group-head { padding:7px 16px 7px 54px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--stroke); background:#fcfcfc; }
  .location-row { border-bottom:1px solid var(--stroke); }
  .location-row:last-child { border-bottom:0; }
  .location-row-summary { display:grid; grid-template-columns:26px minmax(140px,1fr) minmax(110px,.65fr) minmax(125px,.75fr) auto; gap:12px; align-items:center; padding:10px 16px; }
  .location-row:hover { background:#fffdf8; }
  .location-row.is-selected { background:#fff7e9; }
  .location-identity { min-width:0; }
  .location-code { display:block; font-size:16px; letter-spacing:.02em; overflow-wrap:anywhere; }
  .location-identity > span { display:block; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .location-occupancy > span { display:block; font-size:11px; }
  .location-occupancy > strong { display:block; font-size:14px; font-variant-numeric:tabular-nums; }
  .location-occupancy meter { display:block; width:100%; max-width:130px; height:7px; margin-top:3px; }
  .location-occupancy meter::-webkit-meter-bar { background:#e9e9e9; border:0; }
  .location-occupancy meter::-webkit-meter-optimum-value { background:#777; }
  .location-status { display:grid; justify-items:start; gap:4px; }
  .location-status small { color:var(--muted); font-size:11px; }
  .location-badge { display:inline-block; border-radius:6px; padding:3px 7px; font-size:11px; font-weight:750; }
  .location-badge.free { background:#eaf4ee; color:#286244; }
  .location-badge.occupied { background:#fff0d4; color:#78520d; }
  .location-badge.full { background:#fbeaea; color:#9b3232; }
  .location-badge.inactive { background:#eaeaea; color:#555; }
  .location-actions, .location-flags { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .location-actions .btn { padding:8px 10px; font-size:12px; }
  .location-editor { padding:16px; background:#fafafa; border-top:1px dashed var(--stroke); }
  .location-detail-line { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:13px; }
  .location-detail-line span { color:var(--muted); }
  .location-editor p { margin:8px 0; overflow-wrap:anywhere; font-size:12px; }
  .location-edit-form { display:grid; grid-template-columns:minmax(140px,1fr) 110px minmax(130px,.7fr) auto; gap:12px; align-items:end; }
  .location-flags { align-self:center; }
  .location-rack-config { margin-top:14px; border:1px solid var(--stroke); border-radius:10px; background:#fff; }
  .location-rack-config summary, .location-create summary { cursor:pointer; padding:12px 16px; font-weight:700; }
  .location-create summary { display:list-item; list-style-position:inside; }
  .location-create summary > span { display:inline; }
  .location-create summary .muted { display:block; font-weight:400; font-size:12px; margin-top:3px; }
  .location-rack-editor { display:flex; flex-wrap:wrap; gap:10px; align-items:end; padding:12px; }
  .location-rack-editor > label { flex:0 1 220px; }
  .location-rack-editor > p { flex-basis:100%; }
  .location-rack-cells { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px; }
  .location-rack-cell { padding:5px 8px; border:1px solid var(--stroke); border-radius:6px; font-size:12px; overflow-wrap:anywhere; }
  .location-rack-cell.inactive { color:#666; text-decoration:line-through; }
  .location-form { display:grid; gap:12px; padding:16px; max-width:850px; }
  .location-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .location-form > p { margin:0; font-size:12px; }
  .location-preview { display:grid; gap:4px; padding:12px; border-left:3px solid #f89000; background:#fff7e9; overflow-wrap:anywhere; }
  .location-preview span, .location-preview small { font-size:12px; }
  .location-preview.has-error { border-color:#a33535; background:#fff0f0; }
  .location-help { padding:10px 16px; margin:0; color:var(--muted); font-size:12px; border-top:1px solid var(--stroke); }
  .rack-print-sheet { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; }
  #location-selected-count { background:rgba(255,255,255,.7); color:#303030; border-radius:5px; padding:2px 6px; }
  @media (max-width:1100px) {
    .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .location-filters { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .location-row-summary { grid-template-columns:26px minmax(130px,1fr) minmax(105px,.6fr) auto; gap:8px 12px; }
    .location-status { grid-column:2 / 4; display:flex; align-items:center; gap:8px; }
    .location-row-summary > .location-actions { grid-column:4; grid-row:1 / 3; flex-direction:column; align-items:stretch; }
    .location-edit-form { grid-template-columns:minmax(130px,1fr) 120px; }
  }
  @media (max-width:640px) {
    .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .panel-head { flex-wrap:wrap; }
    .location-row-summary { grid-template-columns:24px minmax(0,1fr) 112px; padding:12px; }
    .location-row-summary > .location-actions { grid-column:2 / -1; grid-row:auto; flex-direction:row; }
    .location-actions .btn { flex:1; min-height:42px; }
    .location-status { grid-column:2 / -1; flex-wrap:wrap; }
    .location-filters { padding:12px; gap:10px; }
    .location-filters > label:first-child { grid-column:1 / -1; }
    .location-filters > label:last-child { grid-column:1 / -1; }
    .location-selection { padding:12px; }
    .location-form-grid, .location-edit-form { grid-template-columns:minmax(0,1fr); }
    .location-code { font-size:15px; }
    .location-help { padding:10px 12px; }
    .location-directory > .panel-head { align-items:stretch; }
    .location-directory > .panel-head .btn { width:100%; }
    .location-rack-editor .btn { flex:1 1 160px; }
  }
  @media print {
    html, body { height:auto !important; min-height:0 !important; overflow:visible !important; }
    .sidebar, aside, .topbar, .metrics, .location-layout, .panel-head, .notice { display:none !important; }
    .shell, .content, main { display:block !important; margin:0 !important; padding:0 !important; width:58mm !important; min-width:0 !important; min-height:0 !important; }
    main > .panel { display:block; margin:0 !important; padding:0 !important; border:0 !important; box-shadow:none !important; }
    .rack-print-sheet { display:block; }
    .rack-print-sheet .location-print:last-child { page-break-after:auto; break-after:auto; }
  }
</style>
<noscript><style>.location-layout .location-editor[hidden] { display:block !important; }</style></noscript>
